<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Reports</title>
<link rel="stylesheet" href="_ds/nocturne-e1ee5842-13e2-4a15-8f5e-73e39018410f/styles.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@500;700;900&family=Noto+Serif+SC:wght@500;700;900&display=swap">
<script src="vendor/marked-12.0.2.min.js"></script>
<script src="md-extras.js"></script>
<style>
/* Two panes: the shelf of reports on the left, one report set as a reading page on the right. */
:root{
  color-scheme:dark;
  --ink:var(--color-text,#e9e9ed); --ink2:var(--color-neutral-300,#cfd3e5); --ink3:var(--color-neutral-500,#9397ab);
  --bg:var(--color-bg,#161826); --panel:var(--color-surface,#232532); --line:var(--color-neutral-800,#3f424d);
  --hair:color-mix(in srgb,var(--ink) 9%,transparent);
  --accent:var(--color-accent-400,#b5abfc); --accent-soft:color-mix(in srgb,var(--accent) 13%,transparent);
  --serif:"Noto Serif TC","Noto Serif SC","Songti TC","Songti SC","PMingLiU",Georgia,serif;
  --sans:"Inter","PingFang TC","PingFang SC","Microsoft JhengHei",system-ui,sans-serif;
  --mono:ui-monospace,"SF Mono",Menlo,monospace;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:400 14px/1.5 var(--sans);display:grid;grid-template-columns:330px minmax(0,1fr);overflow:hidden}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:var(--line);border-radius:8px;border:2px solid var(--bg)}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:1px}

/* shelf */
#shelf{display:flex;flex-direction:column;min-height:0;border-right:1px solid var(--hair)}
.shelf-top{padding:16px 16px 12px;display:grid;gap:10px;border-bottom:1px solid var(--hair)}
.shelf-top h1{margin:0;font:700 19px/1.2 var(--serif);letter-spacing:.02em;display:flex;align-items:baseline;gap:8px}
.shelf-top h1 small{font:400 12px var(--sans);color:var(--ink3)}
.row{display:flex;gap:8px;align-items:center}
#q{flex:1;min-width:0;height:32px;padding:0 10px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font:inherit;font-size:13px}
#q::placeholder{color:var(--ink3)}
#refresh{height:32px;width:32px;border-radius:8px;border:1px solid var(--line);background:transparent;color:var(--ink2);font-size:15px;line-height:1}
#refresh:hover{background:var(--accent-soft);color:var(--ink)}
#kinds,#subjects{display:flex;flex-wrap:wrap;gap:6px}
#subjects .chip{border-style:dashed}
.chip{border:1px solid var(--line);background:transparent;border-radius:999px;padding:2px 10px;font-size:12px;color:var(--ink2)}
.chip:hover{color:var(--ink)}
.chip[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--ink)}
#list{flex:1;min-height:0;overflow-y:auto;padding:6px 8px 40px}
.sec{margin:14px 8px 6px;font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--ink3);display:flex;justify-content:space-between}
.item{display:grid;gap:3px;width:100%;text-align:left;border:0;background:transparent;border-radius:8px;padding:9px 10px}
.item:hover{background:color-mix(in srgb,var(--ink) 6%,transparent)}
.item[aria-current="true"]{background:var(--accent-soft)}
.item .t{font:500 14px/1.4 var(--serif);color:var(--ink);overflow-wrap:anywhere}
.item .m{font-size:11.5px;color:var(--ink3);display:flex;gap:8px;flex-wrap:wrap;font-variant-numeric:tabular-nums}
.item .m b{font-weight:500;color:var(--accent)}
.item .m .px{color:var(--ink2)}
.folder{display:flex;justify-content:space-between;align-items:center;width:100%;border:0;background:transparent;border-radius:8px;padding:7px 10px;text-align:left;color:var(--ink2);font-size:13px}
.folder:hover{background:color-mix(in srgb,var(--ink) 6%,transparent);color:var(--ink)}
.folder span:last-child{font-size:11.5px;color:var(--ink3);font-variant-numeric:tabular-nums}
.kids{margin-left:10px;border-left:1px solid var(--hair);padding-left:4px}
.secbtn{position:sticky;top:-6px;z-index:2;display:flex;justify-content:space-between;align-items:center;width:100%;margin:22px 0 6px;padding:11px 10px 9px;border:0;border-top:2px solid var(--ink2);border-radius:0;background:var(--bg);font:700 15px/1.2 var(--serif);letter-spacing:.03em;text-transform:none;color:var(--ink);text-align:left;cursor:default}
.secbtn:first-child{margin-top:8px}
.secbtn[data-shut]{cursor:pointer;color:var(--ink2);border-top-color:var(--line)}
.secbtn[data-shut]:hover{color:var(--ink)}
.secbtn span:last-child{font:500 11.5px/1 var(--sans);letter-spacing:0;color:var(--bg);background:var(--ink2);border-radius:999px;padding:3px 8px;font-variant-numeric:tabular-nums}
.secbtn[data-shut] span:last-child{background:var(--line);color:var(--ink2)}
.ghead{display:grid;gap:3px;width:100%;text-align:left;border:0;background:transparent;border-radius:8px;padding:9px 10px}
.ghead:hover{background:color-mix(in srgb,var(--ink) 6%,transparent)}
.ghead .t{font:700 14px/1.4 var(--serif);color:var(--ink);overflow-wrap:anywhere}
.ghead .m{font-size:11.5px;color:var(--ink3);display:flex;gap:8px;flex-wrap:wrap;font-variant-numeric:tabular-nums}
.ghead .m b{font-weight:500;color:var(--accent)}
.ghead .m .px{color:var(--ink2)}
.note{margin:14px 10px;font-size:12.5px;line-height:1.6;color:var(--ink3);overflow-wrap:anywhere}
.note code{font:12px var(--mono);color:var(--ink2)}

/* reader */
#reader{min-width:0;min-height:0;overflow-y:auto;position:relative;scroll-behavior:smooth;container-type:inline-size}
#bar{position:sticky;top:0;height:2px;background:var(--accent);width:0;z-index:5}
.page{display:grid;grid-template-columns:minmax(0,1fr) 230px;gap:56px;max-width:1640px;margin:0 auto;padding:0 40px 120px}
article{min-width:0}
.head{padding:44px 0 26px;border-bottom:1px solid var(--line);margin-bottom:8px}
.eyebrow{font-size:11.5px;letter-spacing:.11em;text-transform:uppercase;color:var(--accent);display:flex;gap:10px;flex-wrap:wrap;font-variant-numeric:tabular-nums}
.head h1{font:900 clamp(26px,3.3vw,40px)/1.25 var(--serif);margin:12px 0 10px;text-wrap:balance;letter-spacing:.015em}
.head .path{font:12px var(--mono);color:var(--ink3);overflow-wrap:anywhere}
.md{font-size:16.5px;line-height:1.9;color:var(--ink2)}
.md>*{max-width:62em}
.md>.tw,.md>pre{max-width:none}
.md h1{display:none}
.md h2{font:700 25px/1.35 var(--serif);color:var(--ink);margin:58px 0 16px;padding-top:22px;border-top:1px solid var(--line);text-wrap:balance;scroll-margin-top:16px}
.md h3{font:700 19px/1.45 var(--serif);color:var(--ink);margin:38px 0 10px;text-wrap:balance;scroll-margin-top:16px}
.md h4{font:600 16px/1.5 var(--sans);color:var(--ink);margin:26px 0 8px}
.md p{margin:0 0 16px}
.md strong{color:var(--ink);font-weight:600}
.md em{color:var(--ink3)}
.md a{color:var(--accent);text-underline-offset:3px;overflow-wrap:anywhere}
.md ul,.md ol{margin:0 0 18px;padding-left:1.35em}
.md li{margin-bottom:7px}
.md li::marker{color:var(--ink3)}
.md hr{border:0;height:0;margin:0}
.md blockquote{margin:22px 0;padding:14px 20px;border-radius:8px;background:var(--panel);color:var(--ink);font-family:var(--serif);font-weight:500;font-size:16px}
.md blockquote p{margin:0 0 8px}.md blockquote p:last-child{margin:0}
.md code{font:.86em var(--mono);background:var(--panel);padding:1px 6px;border-radius:4px;color:var(--ink);overflow-wrap:anywhere}
.md pre{margin:20px 0;padding:18px 20px;border-radius:8px;background:var(--panel);overflow-x:auto;font:13px/1.65 var(--mono);color:var(--ink)}
.md pre code{background:none;padding:0;font-size:inherit;overflow-wrap:normal}
.tw{margin:20px 0 26px;overflow-x:auto;border:1px solid var(--line);border-radius:8px}
.md table{border-collapse:collapse;width:100%;font:14px/1.6 var(--sans);font-variant-numeric:tabular-nums}
.md th{text-align:left;font-weight:600;font-size:12.5px;color:var(--ink);background:var(--panel);white-space:nowrap;padding:10px 14px}
.md td{padding:10px 14px;border-top:1px solid var(--hair);vertical-align:top;min-width:6em}
.md td:first-child{color:var(--ink);font-weight:500}
.md tbody tr:hover td{background:color-mix(in srgb,var(--ink) 3%,transparent)}
.st{white-space:nowrap;letter-spacing:.06em}.st b{color:var(--accent);font-weight:400}.st i{color:var(--line);font-style:normal}
.pn{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:56px}
.pn button{border:1px solid var(--line);background:transparent;border-radius:8px;padding:14px 16px;text-align:left;display:grid;gap:4px}
.pn button:hover{border-color:var(--accent);background:var(--accent-soft)}
.pn span{font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--ink3)}
.pn b{font:500 15px/1.4 var(--serif);color:var(--ink)}
.pn .next{text-align:right;grid-column:2}
#toc{position:sticky;top:0;align-self:start;padding-top:52px;max-height:100vh;overflow:auto;display:flex;flex-direction:column;gap:2px}
#toc span{font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--ink3);margin-bottom:8px}
#toc a{font-size:12.5px;line-height:1.45;color:var(--ink3);text-decoration:none;padding:5px 0 5px 12px;border-left:1px solid var(--line)}
#toc a:hover,#toc a.on{color:var(--ink);border-left-color:var(--accent)}
.empty{max-width:34em;margin:18vh auto 0;padding:0 32px;color:var(--ink3);line-height:1.8}
.empty h2{font:700 24px/1.3 var(--serif);color:var(--ink);margin:0 0 10px}
.empty code{font:12.5px var(--mono);color:var(--ink2);overflow-wrap:anywhere}
@container (max-width:900px){.page{grid-template-columns:minmax(0,1fr)}#toc{display:none}}
@media (max-width:820px){body{grid-template-columns:minmax(0,1fr);grid-template-rows:42vh minmax(0,1fr)}#shelf{border-right:0;border-bottom:1px solid var(--hair)}.page{padding:0 18px 80px}.head{padding-top:26px}}
@media (prefers-reduced-motion:reduce){#reader{scroll-behavior:auto}}
</style>
</head>
<body>
<aside id="shelf">
  <div class="shelf-top">
    <h1>Reports <small id="count"></small></h1>
    <div class="row">
      <input id="q" type="search" placeholder="Search titles and folders" autocomplete="off">
      <button id="refresh" title="Check the folder for new reports" aria-label="Refresh">↻</button>
    </div>
    <div id="kinds"></div>
    <div id="subjects"></div>
  </div>
  <div id="list"></div>
</aside>
<main id="reader"><div id="bar"></div><div id="view"></div></main>
<script>
(function () {
  var params = new URLSearchParams(location.search);
  var TICKER = (params.get('ticker') || '').toUpperCase();
  var state = { reports: [], dir: '', exists: true, name: '', kind: '', subject: '', q: '', open: {}, current: '' };
  var $ = function (id) { return document.getElementById(id); };
  var esc = function (s) { return String(s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); };
  var store = {
    get: function (k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
    set: function (k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
  };
  var LAST = 'reports-last-' + (TICKER || 'all');

  // A date the report does not state itself is a guess, and is shown with a ~ in front.
  function guessed(r) {
    return r.dated === 'nearby' ? 'This report states no date; this is the newest dated report beside it'
      : r.dated === 'saved' ? 'This report states no date; this is the day the file was last saved' : '';
  }

  // Daily closes of the selected stock, so each report can show what the stock cost the day it was written.
  var px = { dates: [], closes: [] };
  function loadPrices() {
    if (!TICKER) return;
    fetch('/api/moomoo/kline/' + encodeURIComponent(TICKER) + '?k=D').then(function (res) { return res.json(); }).then(function (d) {
      var day = new Intl.DateTimeFormat('en-CA', { timeZone: d.tz || 'America/New_York', year: 'numeric', month: '2-digit', day: '2-digit' });
      (d.bars || []).forEach(function (b) { px.dates.push(day.format(new Date(b[0]))); px.closes.push(b[4]); });
      if (px.dates.length) drawList();
    }).catch(function () {});   // no price feed (moomoo OpenD not running): the list simply shows no prices
  }
  // The close on that day, or on the last trading day before it when the market was shut.
  function priceOn(date) {
    var lo = 0, hi = px.dates.length - 1, at = -1;
    while (lo <= hi) { var mid = (lo + hi) >> 1; if (px.dates[mid] <= date) { at = mid; lo = mid + 1; } else hi = mid - 1; }
    return at < 0 ? null : { close: px.closes[at], day: px.dates[at] };
  }
  function priceHtml(r) {
    var p = TICKER && /^\d{4}-\d{2}-\d{2}$/.test(r.date) ? priceOn(r.date) : null;
    if (!p) return '';
    var note = TICKER + ' closed at $' + p.close.toFixed(2) + ' on ' + p.day + (p.day === r.date ? '' : ', the last trading day on or before ' + r.date) + ' (moomoo, adjusted for splits and dividends)';
    return '<span class="px" title="' + esc(note) + '">$' + p.close.toFixed(2) + '</span>';
  }

  // One stock's reports, sorted into the pieces of work they belong to, so a series or a multi-part
  // study reads as one entry and superseded versions and working notes stay out of the way.
  var SECTIONS = [
    { id: 'start', label: 'Start here', hint: 'The newest series and the newest full research report' },
    { id: 'earnings', label: 'Earnings', hint: 'One entry per results date' },
    { id: 'topics', label: 'Topic studies', hint: 'Valuation, moat, risks, competition and other single questions' },
    { id: 'reference', label: 'Reference', hint: 'Investor comments, interviews and source notes' },
    { id: 'older', label: 'Older versions', hint: 'Earlier versions of a series and earlier research rounds', shut: true },
    { id: 'notes', label: 'Working notes', hint: 'Research notes and audit records behind the reports', shut: true }
  ];
  function isOpen(id, byDefault) { return state.open[id] === undefined ? byDefault : state.open[id]; }
  function organise(rows) {
    var S = { start: [], earnings: [], topics: [], reference: [], older: [], notes: [] };
    var real = function (r) { return r.dated === 'stated' || r.dated === 'name'; };
    var byPath = function (a, b) { return a.path.localeCompare(b.path, 'zh-Hant'); };
    var make = function (id, title, items, unit, open) {
      items.sort(byPath);
      var d = items.reduce(function (m, r) { return real(r) && r.date > m ? r.date : m; }, '');
      return { id: id, title: title, items: items, unit: unit, date: d || items[0].date, guess: !d, open: open };
    };
    var newestFirst = function (a, b) { return (a.guess - b.guess) || b.date.localeCompare(a.date); };   // an undated version counts as older
    var series = {}, notes = {}, earn = {}, team = {}, topicByDay = {}, research = [];
    rows.forEach(function (r) {
      var p = r.path.split('/').slice(2), file = p[p.length - 1], low = r.path.toLowerCase();
      var inSeries = p.length > 1 && /^《看懂/.test(p[0]);
      if (/\/research\/|\/evidence\/|audit|底稿|證據|抽檢|核查/.test(low)) { var k = p.length > 1 ? p[0] : 'Notes'; (notes[k] = notes[k] || []).push(r); }
      else if (inSeries) (series[p[0]] = series[p[0]] || []).push(r);
      else if (r.kind === 'Earnings' || /earnings|財報|三大報表|季報/i.test(file)) (earn[r.date] = earn[r.date] || []).push(r);
      else if (/發言|語錄|訪談|播客|筆記|實錄|對談/.test(file)) S.reference.push(make('r:' + r.path, r.title, [r], 'file', false));
      else if (r.kind === 'Team report' || r.kind === 'Team view') (team[r.group + '|' + (real(r) ? r.date : '')] = team[r.group + '|' + (real(r) ? r.date : '')] || []).push(r);
      else if (r.kind === 'Research') research.push(make('x:' + r.path, r.title, [r], 'file', false));
      else (topicByDay[r.date] = topicByDay[r.date] || []).push(r);
    });
    var versions = Object.keys(series).map(function (k) { return make('s:' + k, k, series[k], 'articles', false); }).sort(newestFirst);
    versions.forEach(function (g, i) { if (i === 0) { g.open = true; g.always = true; S.start.push(g); } else { g.always = true; S.older.push(g); } });
    Object.keys(team).forEach(function (k) { var g = make('t:' + k, team[k].length > 1 ? 'Four-view team report' : team[k][0].title, team[k], 'parts', false); research.push(g); });
    research.sort(newestFirst).forEach(function (g, i) { (i === 0 ? S.start : S.older).push(g); });
    Object.keys(earn).sort().reverse().forEach(function (d) { var it = earn[d]; S.earnings.push(make('e:' + d, it.slice().sort(function (a, b) { return a.title.length - b.title.length; })[0].title, it, 'files', false)); });
    Object.keys(topicByDay).sort().reverse().forEach(function (d) {
      var it = topicByDay[d];
      // Files written the same day as numbered parts of one study are shown as that one study.
      if (it.length > 1 && it.some(function (r) { return /子報告|子报告|part\s*\d/i.test(r.path); })) {
        var lead = it.filter(function (r) { return !/子報告|子报告|精簡|精简/.test(r.path); })[0] || it[0];
        S.topics.push(make('p:' + d, lead.title, it, 'parts', false));
      } else it.sort(byPath).forEach(function (r) { S.topics.push(make('p:' + r.path, r.title, [r], 'file', false)); });
    });
    Object.keys(notes).sort().forEach(function (k) { var g = make('n:' + k, k + ' notes', notes[k], 'files', false); g.always = true; S.notes.push(g); });
    S.older.sort(newestFirst);
    return S;
  }

  function itemHtml(r) {
    var hit = r.rel === 'mention' ? '<span>' + r.hits + '× ' + esc(TICKER) + '</span>' : '';
    return '<button class="item" data-path="' + esc(r.path) + '"' + (r.path === state.current ? ' aria-current="true"' : '') + '>' +
      '<span class="t">' + esc(r.title) + '</span>' +
      '<span class="m"><b>' + esc(r.kind) + '</b><span' + (guessed(r) ? ' title="' + guessed(r) + '">~' : '>') + esc(r.date) + '</span>' + (r.folder ? '<span>' + esc(r.folder) + '</span>' : '') + priceHtml(r) + hit + '</span></button>';
  }

  function drawList() {
    var all = state.reports, q = state.q.trim().toLowerCase();
    var pass = function (r) {
      return (!state.kind || r.skill === state.kind) && (!state.subject || r.subject === state.subject) &&
        (!q || (r.title + ' ' + r.path).toLowerCase().indexOf(q) >= 0);
    };
    var rows = all.filter(pass), html = '';
    $('count').textContent = TICKER ? TICKER : (all.length ? all.length.toLocaleString() + ' saved' : '');
    if (!state.exists) {
      $('list').innerHTML = '<p class="note">The reports folder was not found:<br><code>' + esc(state.dir) + '</code><br><br>Set <code>"reports_dir"</code> in <code>settings.json</code> to the folder your reports are saved in.</p>';
      return;
    }
    if (q) {
      html += '<div class="sec"><span>Matches</span><span>' + rows.length + '</span></div>' + rows.slice(0, 200).map(itemHtml).join('');
      if (rows.length > 200) html += '<p class="note">Showing the newest 200. Type more to narrow it down.</p>';
      if (!rows.length) html += '<p class="note">Nothing matches “' + esc(state.q) + '”.</p>';
    } else {
      if (TICKER) {
        var S = organise(rows);
        if (!rows.length) html += '<p class="note">No report on ' + esc(TICKER) + ' yet. Save one in <code>Company/' + esc(TICKER) + '/</code> in the reports folder and it appears here.</p>';
        SECTIONS.forEach(function (sec) {
          var groups = S[sec.id];
          if (!groups.length) return;
          var n = groups.reduce(function (t, g) { return t + g.items.length; }, 0);
          var shut = sec.shut && !isOpen('sec:' + sec.id, false);
          html += '<button class="secbtn" data-folder="sec:' + sec.id + '" data-open="' + (!shut) + '"' + (sec.shut ? ' data-shut' : '') + ' title="' + esc(sec.hint) + '"><span>' + (sec.shut ? (shut ? '▸ ' : '▾ ') : '') + sec.label + '</span><span>' + n + '</span></button>';
          if (shut) return;
          groups.forEach(function (g) {
            if (g.items.length === 1 && !g.always) { html += itemHtml(g.items[0]); return; }
            var open = isOpen(g.id, g.open);
            html += '<button class="ghead" data-folder="' + esc(g.id) + '" data-open="' + open + '"><span class="t">' + (open ? '▾ ' : '▸ ') + esc(g.title) + '</span>' +
              '<span class="m"><b>' + g.items.length + ' ' + esc(g.unit) + '</b><span>' + (g.guess ? '~' : '') + esc(g.date) + '</span>' + priceHtml({ date: g.date }) + '</span></button>';
            if (open) html += '<div class="kids">' + g.items.map(itemHtml).join('') + '</div>';
          });
        });
      } else {
        html += '<div class="sec"><span>Newest</span><span></span></div>' + rows.slice(0, 8).map(itemHtml).join('');
        var groups = {}, order = [];
        rows.forEach(function (r) { var g = r.folder || '(top level)'; if (!groups[g]) { groups[g] = []; order.push(g); } groups[g].push(r); });
        order.sort(function (a, b) { return a.localeCompare(b, 'zh-Hant'); });
        html += '<div class="sec"><span>Library</span><span>' + order.length + ' folders</span></div>';
        order.forEach(function (g) {
          var open = !!state.open[g];
          html += '<button class="folder" data-folder="' + esc(g) + '" aria-expanded="' + open + '"><span>' + (open ? '▾ ' : '▸ ') + esc(g) + '</span><span>' + groups[g].length + '</span></button>';
          if (open) html += '<div class="kids">' + groups[g].map(itemHtml).join('') + '</div>';
        });
      }
    }
    $('list').innerHTML = html;
  }

  function chips(el, field, current, key) {
    var n = {};
    state.reports.forEach(function (r) { n[r[field]] = (n[r[field]] || 0) + 1; });
    var names = Object.keys(n).sort(function (a, b) { return n[b] - n[a]; });
    $(el).innerHTML = ['<button class="chip" data-' + key + '="" aria-pressed="' + (!current) + '">All</button>'].concat(names.map(function (k) {
      return '<button class="chip" data-' + key + '="' + esc(k) + '" aria-pressed="' + (current === k) + '" title="' + n[k] + ' reports">' + esc(k) + '</button>';
    })).join('');
  }
  function drawKinds() {
    chips('kinds', 'skill', state.kind, 'kind');
    if (TICKER) { $('subjects').hidden = true; return; }   // one stock is one subject
    chips('subjects', 'subject', state.subject, 'subject');
  }

  function emptyView() {
    $('view').innerHTML = '<div class="empty"><h2>Pick a report</h2><p>This tab reads the reports saved in<br><code>' + esc(state.dir) + '</code></p><p>' + (TICKER ? 'Only reports saved in <code>Company/' + esc(TICKER) + '/</code> are shown for this stock.' : 'A new report shows up here by itself.') + '</p></div>';
  }

  function resolve(base, href) {
    var parts = base.split('/'); parts.pop();
    var target = href.split('#')[0];
    try { target = decodeURIComponent(target); } catch (e) {}   // a name with a bare % in it is not an encoded link
    target.split('/').forEach(function (p) { if (p === '..') parts.pop(); else if (p && p !== '.') parts.push(p); });
    return parts.join('/');
  }

  function show(path, keepScroll) {
    var r = state.reports.find(function (x) { return x.path === path; });
    state.current = path; store.set(LAST, path); drawList();
    fetch('/api/reports/file?path=' + encodeURIComponent(path)).then(function (res) { return res.json(); }).then(function (doc) {
      if (!doc || doc.error) { $('view').innerHTML = '<div class="empty"><h2>That report is gone</h2><p>It may have been renamed or moved. Press ↻ to reload the list.</p></div>'; return; }
      var text = doc.text.replace(/^﻿?---\n[\s\S]*?\n---\n/, '');
      var body = document.createElement('div'); body.className = 'md';
      body.innerHTML = marked.parse(text, { gfm: true, breaks: false });
      var h1 = body.querySelector('h1'), title = h1 ? h1.textContent : (r ? r.title : path);
      body.querySelectorAll('table').forEach(function (t) { var w = document.createElement('div'); w.className = 'tw'; t.parentNode.insertBefore(w, t); w.appendChild(t); });
      var toc = [];
      body.querySelectorAll('h2,h3').forEach(function (h, i) { h.id = 's' + i; if (h.tagName === 'H2') toc.push([h.id, h.textContent]); });
      body.querySelectorAll('a[href]').forEach(function (a) {
        var href = a.getAttribute('href');
        if (/^https?:/i.test(href)) { a.target = '_blank'; a.rel = 'noopener'; }
        else if (/\.md(#.*)?$/i.test(href)) { a.dataset.report = resolve(path, href); a.href = '#'; }
      });
      var walk = document.createTreeWalker(body, NodeFilter.SHOW_TEXT), nodes = [], nd;
      while ((nd = walk.nextNode())) if (/[★☆]/.test(nd.nodeValue) && !nd.parentNode.closest('pre,code')) nodes.push(nd);
      nodes.forEach(function (t) {
        var span = document.createElement('span');
        span.innerHTML = esc(t.nodeValue).replace(/(★*)(☆*)/g, function (m, a, b) { return m ? '<span class="st"><b>' + a + '</b><i>' + b + '</i></span>' : ''; });
        t.parentNode.replaceChild(span, t);
      });
      var mins = Math.max(1, Math.round(text.replace(/\s/g, '').length / 550));
      var sibs = state.reports.filter(function (x) { return x.group === (r ? r.group : '') && x.group; }).sort(function (a, b) { return a.file.localeCompare(b.file, 'zh-Hant'); });
      var at = sibs.findIndex(function (x) { return x.path === path; });
      var prev = at > 0 ? sibs[at - 1] : null, next = at >= 0 && at < sibs.length - 1 ? sibs[at + 1] : null;
      var pn = (prev || next) ? '<div class="pn">' +
        (prev ? '<button data-path="' + esc(prev.path) + '"><span>Previous in this folder</span><b>' + esc(prev.title) + '</b></button>' : '') +
        (next ? '<button class="next" data-path="' + esc(next.path) + '"><span>Next in this folder</span><b>' + esc(next.title) + '</b></button>' : '') + '</div>' : '';
      $('view').innerHTML = '<div class="page"><article><header class="head"><div class="eyebrow"><span>' + esc(r ? r.kind : 'Report') + '</span><span>' + (r && guessed(r) ? '~' : '') + esc(r ? r.date : '') + '</span><span>' + mins + ' min read</span></div><h1>' + esc(title) + '</h1><div class="path">' + esc(path) + '</div></header><div id="body"></div>' + pn + '</article>' +
        (toc.length > 2 ? '<nav id="toc" aria-label="Sections"><span>In this report</span>' + toc.map(function (t) { return '<a href="#' + t[0] + '">' + esc(t[1]) + '</a>'; }).join('') + '</nav>' : '') + '</div>';
      $('body').appendChild(body);
      if (window.enhanceMarkdown) window.enhanceMarkdown(body);   // Mermaid diagrams and charts
      if (!keepScroll) $('reader').scrollTop = 0;
      onScroll();
    }).catch(function (err) {
      // Only a failed request means the server is down; anything else is a problem showing this one report.
      var down = err instanceof TypeError && /fetch|network|load/i.test(String(err.message));
      $('view').innerHTML = '<div class="empty"><h2>Could not ' + (down ? 'read' : 'show') + ' the report</h2><p>' + (down ? 'The local server is not answering. Start it with <code>python3 sec_db.py serve</code>.' : 'The file was read, but the page hit an error displaying it: <code>' + esc(err && err.message || err) + '</code>') + '</p></div>';
    });
  }

  function onScroll() {
    var el = $('reader'), max = el.scrollHeight - el.clientHeight;
    $('bar').style.width = (max > 0 ? Math.min(100, el.scrollTop / max * 100) : 0) + '%';
    var links = document.querySelectorAll('#toc a'), on = null;
    links.forEach(function (a) { var h = document.getElementById(a.getAttribute('href').slice(1)); if (h && h.getBoundingClientRect().top < 120) on = a; });
    links.forEach(function (a) { a.classList.toggle('on', a === on); });
  }

  function load(first) {
    return fetch('/api/reports?ticker=' + encodeURIComponent(TICKER)).then(function (res) { return res.json(); }).then(function (d) {
      state.reports = d.reports || []; state.dir = d.dir || '';
      // With a stock selected the tab shows that stock's own folder and nothing else.
      if (TICKER) state.reports = state.reports.filter(function (r) { return r.subject === 'Company' && r.folder.toUpperCase() === TICKER; }); state.exists = d.exists !== false; state.name = d.name || '';
      drawKinds(); drawList();
      if (!first) return;
      var last = store.get(LAST), own = [];
      if (TICKER) { var S0 = organise(state.reports.slice()); SECTIONS.some(function (sec) { if (S0[sec.id].length) { own = S0[sec.id][0].items; return true; } }); }
      var pick = state.reports.some(function (r) { return r.path === last; }) ? last : (own[0] ? own.slice().sort(function (a, b) { return a.file.localeCompare(b.file, 'zh-Hant'); })[0].path : '');
      if (pick) show(pick); else emptyView();
    }).catch(function () {
      $('list').innerHTML = '<p class="note">The local server is not answering. Start it with <code>python3 sec_db.py serve</code> and press ↻.</p>';
      if (first) emptyView();
    });
  }

  $('list').addEventListener('click', function (e) {
    var it = e.target.closest('[data-path]'), f = e.target.closest('[data-folder]');
    if (it) show(it.dataset.path);
    else if (f) { state.open[f.dataset.folder] = f.dataset.open === undefined ? !state.open[f.dataset.folder] : f.dataset.open !== 'true'; drawList(); }
  });
  $('kinds').addEventListener('click', function (e) { var c = e.target.closest('[data-kind]'); if (c) { state.kind = c.dataset.kind; drawKinds(); drawList(); } });
  $('subjects').addEventListener('click', function (e) { var c = e.target.closest('[data-subject]'); if (c) { state.subject = c.dataset.subject; drawKinds(); drawList(); } });
  $('q').addEventListener('input', function (e) { state.q = e.target.value; drawList(); });
  $('refresh').addEventListener('click', function () { load(false); });
  $('view').addEventListener('click', function (e) {
    var a = e.target.closest('a[data-report]'), b = e.target.closest('button[data-path]'), t = e.target.closest('#toc a');
    if (a) { e.preventDefault(); show(a.dataset.report); }
    else if (b) show(b.dataset.path);
    else if (t) { e.preventDefault(); var h = document.getElementById(t.getAttribute('href').slice(1)); if (h) h.scrollIntoView(); }
  });
  $('reader').addEventListener('scroll', onScroll, { passive: true });
  window.addEventListener('focus', function () { load(false); });
  load(true);
  loadPrices();
})();
</script>
</body>
</html>
