    .hint:hover, .hint:focus-visible { color: var(--color-accent); background: color-mix(in srgb, var(--color-accent) 18%, transparent); }
    .hint-pop { display: none; position: absolute; top: calc(100% + 8px); left: 0; z-index: 30; width: min(460px, 80vw); gap: 10px; padding: 14px 16px; border-radius: var(--radius-md); background: var(--color-surface); border: 1px solid var(--color-divider); box-shadow: 0 12px 32px rgba(0,0,0,0.45); cursor: default; font-weight: 400; text-align: left; }
    .hint:hover .hint-pop, .hint:focus-visible .hint-pop, .hint:focus-within .hint-pop { display: grid; }
    .grp-row .grp-act { display: none; }
    .grp-row:hover .grp-act, .grp-row:focus-within .grp-act { display: flex; }
    .grp-row:hover .grp-count, .grp-row:focus-within .grp-count { display: none; }
    .hint-pop::before { content: ''; position: absolute; left: 0; right: 0; top: -10px; height: 10px; }
    .sel { width: 100%; min-width: 0; min-height: 32px; padding: 4px 26px 4px 10px; background-color: var(--color-bg); border: 1px solid var(--color-divider); border-radius: var(--radius-md); color: var(--color-text); font: inherit; font-size: 13px; outline: none; appearance: none; -webkit-appearance: none; box-sizing: border-box; }
    select.sel { background-image: linear-gradient(45deg, transparent 50%, var(--color-neutral-400) 50%), linear-gradient(135deg, var(--color-neutral-400) 50%, transparent 50%); background-position: calc(100% - 15px) 14px, calc(100% - 10px) 14px; background-size: 5px 5px, 5px 5px; background-repeat: no-repeat; }

    .ins-wrap { container-type: inline-size; }

    .ins-chart { order: -1; max-width: 480px; }

</helmet>
<div style="display:grid;grid-template-columns:64px 300px minmax(0,1fr);height:100vh;overflow:hidden;font-variant-numeric:tabular-nums">

                    <div style="display:grid;gap:4px">
                      <span style="font-size:11px;letter-spacing:0.08em;text-transform:uppercase;color:var(--color-neutral-500)">What it is used for</span>
                      <p style="margin:0;font-size:13px;line-height:1.5;color:var(--color-neutral-300)">{{ sc.use }}</p>
                    </div>
                    <div style="display:grid;gap:4px">
                      <span style="font-size:11px;letter-spacing:0.08em;text-transform:uppercase;color:var(--color-neutral-500)">How to read it</span>
                      <p style="margin:0;font-size:13px;line-height:1.5;color:var(--color-neutral-300)">{{ sc.read }}</p>
                    </div>
                    <sc-if value="{{ sc.hasParts }}" hint-placeholder-val="{{ true }}">
                      <div style="display:grid">
                        <sc-for list="{{ sc.parts }}" as="pt" hint-placeholder-count="5">
                          <div style="display:grid;grid-template-columns:18px minmax(0,1fr) auto;gap:8px;align-items:baseline;padding:5px 0;font-size:12.5px;background:linear-gradient(to right, transparent, color-mix(in srgb, var(--color-text) 8%, transparent) 24px, color-mix(in srgb, var(--color-text) 8%, transparent) calc(100% - 24px), transparent) no-repeat bottom / 100% 1px">
                            <i class="{{ pt.icon }}" style="font-size:14px;color:{{ pt.color }};align-self:center"></i>
                            <span title="{{ pt.tip }}">{{ pt.label }}</span>
                            <span style="color:var(--color-neutral-400);white-space:nowrap">{{ pt.detail }}</span>
                          </div>
                        </sc-for>
                      </div>
                    </sc-if>
                    <sc-if value="{{ sc.note }}" hint-placeholder-val="{{ false }}"><p style="margin:0;font-size:12px;color:var(--color-neutral-500)">{{ sc.note }}</p></sc-if>
                  </div>
                </sc-for>
              </div>
              <p style="margin:0;font-size:12px;color:var(--color-neutral-500)">{{ scoreNote }}</p>
            </section>

            <section id="sub-statements" style="display:grid;gap:14px;padding-top:36px">
              <div style="display:flex;align-items:center;gap:12px;flex-wrap:wrap"><h4 style="margin:0;font-size:18px">Statements</h4></div>
              <div style="display:grid;gap:10px">
                <div style="display:flex;gap:14px;align-items:center;justify-content:space-between;flex-wrap:wrap">
                  <div class="seg">
                    <sc-for list="{{ stmtTabs }}" as="tb" hint-placeholder-count="3">
                      <label class="seg-opt"><input type="radio" name="stmt-tab" checked="{{ tb.on }}" onChange="{{ tb.pick }}">{{ tb.label }}</label>
                    </sc-for>
                  </div>
                  <div class="seg">
                    <sc-for list="{{ periodTabs }}" as="tb" hint-placeholder-count="2">
                      <label class="seg-opt"><input type="radio" name="stmt-period" checked="{{ tb.on }}" onChange="{{ tb.pick }}">{{ tb.label }}</label>
                    </sc-for>
                  </div>
                </div>
                <div style="display:flex;gap:16px;align-items:center;flex-wrap:wrap">
                  <button class="btn btn-ghost" onClick="{{ stmtToggleAll }}" style="font-size:12.5px;display:flex;align-items:center;gap:6px;padding-left:0"><i class="{{ stmtAllIcon }}"></i>{{ stmtAllLabel }}</button>
                  <sc-if value="{{ isQuarterly }}" hint-placeholder-val="{{ false }}">
                    <div class="seg">
                      <sc-for list="{{ cmpTabs }}" as="tb" hint-placeholder-count="2">
                        <label class="seg-opt" style="font-size:12px;padding:4px 10px"><input type="radio" name="stmt-cmp" checked="{{ tb.on }}" onChange="{{ tb.pick }}">{{ tb.label }}</label>
                      </sc-for>
                    </div>
                  </sc-if>
                  <div style="position:relative">
                    <button onClick="{{ unitToggle }}" aria-haspopup="listbox" style="display:flex;align-items:center;gap:8px;min-height:30px;padding:4px 10px;background:{{ unitBtnBg }};border:1px solid {{ unitBtnBorder }};border-radius:var(--radius-md);color:var(--color-neutral-400);font:inherit;font-size:12.5px;cursor:pointer" style-hover="border-color:var(--color-neutral-600)">Unit <span style="color:var(--color-text);font-weight:500">{{ unitLabel }}</span><i class="{{ unitCaret }}" style="font-size:11px"></i></button>
                    <sc-if value="{{ unitOpen }}" hint-placeholder-val="{{ false }}">
                      <div onClick="{{ unitClose }}" style="position:fixed;inset:0;z-index:20"></div>
                      <div role="listbox" style="position:absolute;top:calc(100% + 6px);left:0;z-index:21;display:grid;gap:2px;min-width:160px;padding:4px;background:var(--color-surface);border:1px solid var(--color-divider);border-radius:var(--radius-md);box-shadow:0 12px 32px rgba(0,0,0,0.45)">
                        <sc-for list="{{ unitTabs }}" as="o" hint-placeholder-count="3">
                          <button role="option" onClick="{{ o.pick }}" style="display:flex;align-items:center;justify-content:space-between;gap:12px;padding:7px 10px;background:{{ o.bg }};border:0;border-radius:var(--radius-sm);color:{{ o.color }};font:inherit;font-size:13px;text-align:left;cursor:pointer" style-hover="background:var(--color-neutral-800)"><span>{{ o.label }}</span><i class="{{ o.icon }}" style="font-size:13px;color:var(--color-accent)"></i></button>
                        </sc-for>
                      </div>
                    </sc-if>
                  </div>
                  <label class="sw"><input type="checkbox" checked="{{ showChg }}" onChange="{{ toggleChg }}"><span class="trk"></span>% change</label>
                  <label class="sw"><input type="checkbox" checked="{{ showHeat }}" onChange="{{ toggleHeat }}"><span class="trk"></span>Heat map</label>
                </div>
              </div>
              <sc-if value="{{ stmtNote }}" hint-placeholder-val="{{ false }}">
                <p style="margin:0;font-size:12.5px;color:var(--color-neutral-400)">{{ stmtNote }}</p>
              </sc-if>
              <div data-scroll-end="1" style="overflow-x:auto;overflow-y:hidden;padding-bottom:6px">
                <div style="display:grid;width:max-content">
                  <div style="display:grid;grid-template-columns:{{ stmtCols }};padding:6px 0;background:linear-gradient(to right, transparent, var(--color-divider) 48px, var(--color-divider) calc(100% - 48px), transparent) no-repeat bottom / 100% 1px">
                    <span style="font-size:11px;letter-spacing:0.08em;text-transform:uppercase;color:var(--color-neutral-500);position:sticky;left:0;align-self:stretch;display:flex;align-items:center;background:var(--color-bg);z-index:2">{{ stmtUnit }}</span>
                    <sc-for list="{{ years }}" as="y" hint-placeholder-count="16"><span style="font-size:11px;letter-spacing:0.08em;color:var(--color-neutral-500);text-align:right;padding-right:7px">{{ y.label }}</span></sc-for>
                  </div>
                  <sc-for list="{{ stmtRows }}" as="r" hint-placeholder-count="7">
                    <div style="display:grid;grid-template-columns:{{ stmtCols }};align-items:center;padding:2px 0;min-height:32px;margin-top:{{ r.mt }};border-radius:{{ r.radius }};background:{{ r.rowBg }}">
                      <span style="font-size:{{ r.size }};letter-spacing:{{ r.ls }};text-transform:{{ r.tt }};font-weight:{{ r.weight }};color:{{ r.color }};position:sticky;left:0;align-self:stretch;display:flex;align-items:center;background:{{ r.labelBg }};border-radius:{{ r.radius }};z-index:2;padding:5px 8px 5px {{ r.pad }}">
                        <sc-if value="{{ r.hasCaret }}" hint-placeholder-val="{{ false }}"><button onClick="{{ r.toggle }}" title="Show or hide these lines" style="display:flex;align-items:center;gap:6px;background:transparent;border:0;padding:0;margin:0;color:inherit;font:inherit;font-weight:inherit;text-transform:inherit;letter-spacing:inherit;cursor:pointer;text-align:left" style-hover="color:var(--color-accent)"><i class="{{ r.caret }}" style="font-size:11px;color:inherit;opacity:0.8"></i>{{ r.label }}</button></sc-if>
                        <sc-if value="{{ r.plain }}" hint-placeholder-val="{{ true }}">{{ r.label }}</sc-if>
                      </span>
                      <sc-if value="{{ r.isInput }}" hint-placeholder-val="{{ true }}">
                        <sc-for list="{{ r.cells }}" as="cl" hint-placeholder-count="16"><div style="display:grid;margin:1px;border-radius:var(--radius-sm);background:{{ cl.heat }}"><input value="{{ cl.v }}" onChange="{{ cl.on }}" readOnly="{{ cl.ro }}" inputMode="decimal" placeholder="—" style="width:100%;min-width:0;background:transparent;border:1px solid transparent;border-radius:var(--radius-sm);color:var(--color-text);font:inherit;font-size:13px;font-weight:{{ r.weight }};padding:4px 6px 1px;outline:none;text-align:right" style-hover="border-color:var(--color-divider)" style-focus="border-color:var(--color-accent);background:var(--color-surface)"><sc-if value="{{ cl.hasChg }}" hint-placeholder-val="{{ false }}"><span style="font-size:10.5px;text-align:right;padding:0 7px 3px;color:{{ cl.chgColor }}">{{ cl.chg }}</span></sc-if></div></sc-for>
                      </sc-if>
                      <sc-if value="{{ r.isText }}" hint-placeholder-val="{{ false }}">
                        <sc-for list="{{ r.cells }}" as="cl" hint-placeholder-count="16"><div style="display:grid;margin:1px;border-radius:var(--radius-sm);background:{{ cl.heat }}"><span style="font-size:13px;font-weight:{{ r.weight }};text-align:right;padding:5px 7px 1px;color:{{ r.color }}">{{ cl.v }}</span><sc-if value="{{ cl.hasChg }}" hint-placeholder-val="{{ false }}"><span style="font-size:10.5px;text-align:right;padding:0 7px 3px;color:{{ cl.chgColor }}">{{ cl.chg }}</span></sc-if></div></sc-for>
                      </sc-if>
                    </div>
                  </sc-for>
                </div>
              </div>
              <p style="margin:0;font-size:12.5px;color:var(--color-neutral-500)">Figures in {{ stmtUnitWords }}, oldest year on the left, going back as far as the source has figures. Click a heading to show or hide its lines. On the balance sheet each heading is the total and the lines under it are what make it up; on the other statements a closed heading shows its total. White rows can be typed over, grey rows are read from the filings or calculated, and "Other" or "Not itemised" rows are what is left of a total after the named lines. A grey line marked "counted in another line" is a detail the filing reports inside one of the other lines, so it is shown but not added in twice. Money paid out (capex, acquisitions, dividends, buybacks, debt repaid) is shown as a positive number.</p>
            </section>

            <section id="sub-flows" style="display:grid;gap:14px;padding-top:36px">
              <div style="display:flex;align-items:center;gap:12px;flex-wrap:wrap">
                <h4 style="margin:0;font-size:18px">Statement flows</h4>
              </div>
              <sc-if value="{{ hasFlows }}" hint-placeholder-val="{{ false }}">
                <div style="display:grid;gap:10px">
                  <div style="display:flex;gap:14px;align-items:center;justify-content:space-between;flex-wrap:wrap">
                    <div class="seg"><sc-for list="{{ flowTabs }}" as="tb" hint-placeholder-count="3"><label class="seg-opt"><input type="radio" name="flow-tab" checked="{{ tb.on }}" onChange="{{ tb.pick }}">{{ tb.label }}</label></sc-for></div>
                    <div class="seg"><sc-for list="{{ flowPeriodTabs }}" as="tb" hint-placeholder-count="2"><label class="seg-opt"><input type="radio" name="flow-period" checked="{{ tb.on }}" onChange="{{ tb.pick }}">{{ tb.label }}</label></sc-for></div>
                  </div>
                  <div><div class="seg" style="display:inline-flex"><sc-for list="{{ flowYears }}" as="tb" hint-placeholder-count="5"><label class="seg-opt" style="font-size:12px;padding:4px 10px"><input type="radio" name="flow-year" checked="{{ tb.on }}" onChange="{{ tb.pick }}">{{ tb.label }}</label></sc-for></div></div>
                </div>
              </sc-if>
              <sc-for list="{{ flows }}" as="fl" hint-placeholder-count="3">
                <div style="display:grid;gap:8px;padding:16px;border-radius:var(--radius-md);background:var(--color-surface);border:1px solid var(--color-divider)">
                  <div style="display:grid;gap:2px"><span style="font-size:15px;font-weight:600">{{ fl.title }}</span><span style="font-size:12px;color:var(--color-neutral-400)">{{ fl.sub }}</span></div>
                  <sc-if value="{{ fl.has }}" hint-placeholder-val="{{ true }}"><div style="overflow-x:auto">{{ fl.svg }}</div></sc-if>
                  <sc-if value="{{ fl.msg }}" hint-placeholder-val="{{ false }}"><p style="margin:0;font-size:13px;color:var(--color-neutral-400)">{{ fl.msg }}</p></sc-if>
                </div>
              </sc-for>
              <p style="margin:0;font-size:12px;color:var(--color-neutral-500)">{{ flowNote }}</p>
            </section>

            <section id="sub-commonsize" style="display:grid;gap:14px;padding-top:36px">
              <div style="display:flex;align-items:center;gap:12px;flex-wrap:wrap"><h4 style="margin:0;font-size:18px">Common-size statements</h4></div>
              <p style="margin:0;font-size:13px;color:var(--color-neutral-400)">Each line as a share of revenue or total assets, so the mix can be compared across years and against peers of any size.</p>
              <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:28px;align-items:start">
                <sc-for list="{{ commonSize }}" as="g" hint-placeholder-count="3">
                  <div style="display:grid">
                    <div style="display:grid;grid-template-columns:1fr repeat(3,60px);gap:8px;padding:6px 0;background:linear-gradient(to right, transparent, var(--color-divider) 48px, var(--color-divider) calc(100% - 48px), transparent) no-repeat bottom / 100% 1px">
                      <span style="font-size:11px;letter-spacing:0.08em;text-transform:uppercase;color:var(--color-neutral-500)">{{ g.title }}</span>
                      <sc-for list="{{ csYears }}" as="y" hint-placeholder-count="3"><span style="font-size:11px;letter-spacing:0.08em;color:var(--color-neutral-500);text-align:right">{{ y.label }}</span></sc-for>
                    </div>
                    <sc-for list="{{ g.rows }}" as="r" hint-placeholder-count="6">
                      <div style="display:grid;grid-template-columns:1fr repeat(3,60px);gap:8px;padding:7px 0;background:linear-gradient(to right, transparent, color-mix(in srgb, var(--color-text) 8%, transparent) 48px, color-mix(in srgb, var(--color-text) 8%, transparent) calc(100% - 48px), transparent) no-repeat bottom / 100% 1px">
                        <span style="font-size:13px">{{ r.label }}</span>
                        <sc-for list="{{ r.vals }}" as="v" hint-placeholder-count="3"><span style="font-size:13px;text-align:right">{{ v.t }}</span></sc-for>
                      </div>
                    </sc-for>
                  </div>
                </sc-for>
              </div>
            </section>

            <section id="sub-ratios" style="display:grid;gap:14px;padding-top:36px">
              <div style="display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap"><h4 style="margin:0;font-size:18px">Ratios</h4><label style="display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--color-neutral-400)">Tax rate used for ROIC <input class="input" value="{{ taxRate }}" onChange="{{ onTax }}" inputMode="decimal" style="width:56px;min-height:30px;font-size:13px">%</label></div>
              <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(380px,1fr));gap:28px;align-items:start">
                <sc-for list="{{ ratioGroups }}" as="g" hint-placeholder-count="4">
                  <div style="display:grid">
                    <div style="display:grid;grid-template-columns:1fr repeat(3,68px);gap:8px;padding:6px 0;background:linear-gradient(to right, transparent, var(--color-divider) 48px, var(--color-divider) calc(100% - 48px), transparent) no-repeat bottom / 100% 1px">
                      <span style="font-size:11px;letter-spacing:0.08em;text-transform:uppercase;color:var(--color-accent-300)">{{ g.title }}</span>
                      <span style="font-size:11px;letter-spacing:0.08em;text-transform:uppercase;color:var(--color-neutral-500);text-align:right">Latest</span>
                      <span style="font-size:11px;letter-spacing:0.08em;text-transform:uppercase;color:var(--color-neutral-500);text-align:right">5-yr avg</span>
                      <span style="font-size:11px;letter-spacing:0.08em;text-transform:uppercase;color:var(--color-neutral-500);text-align:right">10-yr avg</span>
                    </div>
                    <sc-for list="{{ g.rows }}" as="r" hint-placeholder-count="4">
                      <div style="display:grid;grid-template-columns:1fr repeat(3,68px);gap:8px;padding:7px 0;background:linear-gradient(to right, transparent, color-mix(in srgb, var(--color-text) 8%, transparent) 48px, color-mix(in srgb, var(--color-text) 8%, transparent) calc(100% - 48px), transparent) no-repeat bottom / 100% 1px">
                        <span style="font-size:13px">{{ r.label }}</span>
                        <span style="font-size:13px;font-weight:500;text-align:right">{{ r.latest }}</span>
                        <span style="font-size:13px;text-align:right;color:var(--color-neutral-300)">{{ r.a5 }}</span>
                        <span style="font-size:13px;text-align:right;color:var(--color-neutral-300)">{{ r.a10 }}</span>
                      </div>
                    </sc-for>
                  </div>
                </sc-for>
              </div>
            </section>

            <section id="sub-peers" style="display:grid;gap:14px;padding-top:36px">
              <div style="display:flex;align-items:center;gap:12px;flex-wrap:wrap"><h4 style="margin:0;font-size:18px">Peer analysis</h4></div>
              <p style="margin:0;font-size:13px;color:var(--color-neutral-400)">Peers and their multiples fill in from your data source when available; anything blank or wrong can be typed over. The first row is calculated from this company's figures and price.</p>
              <div style="overflow-x:auto">
                <div style="display:grid;min-width:760px">
                  <div style="display:grid;grid-template-columns:minmax(120px,1.3fr) repeat(6,minmax(78px,1fr)) 28px;gap:6px;padding:6px 0;background:linear-gradient(to right, transparent, var(--color-divider) 48px, var(--color-divider) calc(100% - 48px), transparent) no-repeat bottom / 100% 1px">
                    <sc-for list="{{ peerHead }}" as="h" hint-placeholder-count="7"><span style="font-size:11px;letter-spacing:0.08em;text-transform:uppercase;color:var(--color-neutral-500);text-align:{{ h.align }};padding:0 7px">{{ h.label }}</span></sc-for>
                    <span></span>
                  </div>
                  <div style="display:grid;grid-template-columns:minmax(120px,1.3fr) repeat(6,minmax(78px,1fr)) 28px;gap:6px;padding:8px 0;background:linear-gradient(to right, transparent, color-mix(in srgb, var(--color-text) 8%, transparent) 48px, color-mix(in srgb, var(--color-text) 8%, transparent) calc(100% - 48px), transparent) no-repeat bottom / 100% 1px">
                    <span style="font-size:13.5px;font-weight:500;color:var(--color-accent-300);padding:0 7px">{{ T }}</span>
                    <sc-for list="{{ peerSelf }}" as="v" hint-placeholder-count="6"><span style="font-size:13.5px;font-weight:500;text-align:right;padding:0 7px">{{ v.t }}</span></sc-for>
                    <span></span>
                  </div>
                  <sc-for list="{{ peers }}" as="p" hint-placeholder-count="3">
                    <div style="display:grid;grid-template-columns:minmax(120px,1.3fr) repeat(6,minmax(78px,1fr)) 28px;gap:6px;padding:3px 0;align-items:center;background:linear-gradient(to right, transparent, color-mix(in srgb, var(--color-text) 8%, transparent) 48px, color-mix(in srgb, var(--color-text) 8%, transparent) calc(100% - 48px), transparent) no-repeat bottom / 100% 1px">
                      <sc-for list="{{ p.cells }}" as="cl" hint-placeholder-count="7"><input value="{{ cl.v }}" onChange="{{ cl.on }}" placeholder="{{ cl.ph }}" style="width:100%;min-width:0;background:transparent;border:1px solid transparent;border-radius:var(--radius-sm);color:var(--color-text);font:inherit;font-size:13.5px;padding:5px 6px;outline:none;text-align:{{ cl.align }}" style-hover="border-color:var(--color-divider)" style-focus="border-color:var(--color-accent);background:var(--color-surface)"></sc-for>
                      <button onClick="{{ p.remove }}" title="Remove" style="width:28px;height:28px;display:grid;place-items:center;background:transparent;border:0;border-radius:var(--radius-sm);color:var(--color-neutral-500);cursor:pointer" style-hover="color:var(--color-text);background:color-mix(in srgb, var(--color-text) 7%, transparent)"><i class="ph ph-x"></i></button>
                    </div>
                  </sc-for>
                  <div style="display:grid;grid-template-columns:minmax(120px,1.3fr) repeat(6,minmax(78px,1fr)) 28px;gap:6px;padding:8px 0">
                    <span style="font-size:13px;color:var(--color-neutral-400);padding:0 7px">Peer median</span>
                    <sc-for list="{{ peerMedian }}" as="v" hint-placeholder-count="6"><span style="font-size:13px;text-align:right;padding:0 7px;color:var(--color-neutral-300)">{{ v.t }}</span></sc-for>
                    <span></span>
                  </div>
                </div>
              </div>
              <div><button class="btn btn-secondary" onClick="{{ addPeer }}"><i class="ph ph-plus"></i>Add peer</button></div>
            </section>
          </sc-if>

          <sc-if value="{{ is.redflags }}" hint-placeholder-val="{{ false }}">
            
            <section id="sub-screens" style="display:grid;gap:14px;padding-top:12px">
              <div style="display:flex;align-items:center;gap:12px;flex-wrap:wrap"><h4 style="margin:0;font-size:18px">Screens from the numbers</h4></div>
              <p style="margin:0;font-size:13px;color:var(--color-neutral-400)">Automatic checks on the statements. A flag is a reason to read the notes, not a verdict.</p>
              <div style="display:grid">
                <sc-for list="{{ screens }}" as="s" hint-placeholder-count="5">
                  <div style="display:grid;grid-template-columns:72px minmax(160px,1fr) minmax(200px,2fr);gap:14px;align-items:center;padding:11px 0;background:linear-gradient(to right, transparent, color-mix(in srgb, var(--color-text) 8%, transparent) 48px, color-mix(in srgb, var(--color-text) 8%, transparent) calc(100% - 48px), transparent) no-repeat bottom / 100% 1px">
                    <span class="{{ s.tagClass }}" style="justify-content:center">{{ s.tagText }}</span>
                    <span style="font-size:14px;font-weight:500">{{ s.label }}</span>
                    <span style="font-size:13px;color:var(--color-neutral-300)">{{ s.detail }}</span>
                  </div>
                </sc-for>
              </div>
            </section>
            <section id="sub-manual" style="display:grid;gap:14px;padding-top:36px">
              <div style="display:flex;align-items:center;gap:12px;flex-wrap:wrap"><h4 style="margin:0;font-size:18px">Governance and accounting</h4></div>
              <p style="margin:0;font-size:13px;color:var(--color-neutral-400)">These need reading. The proxy statement and the notes to the financial statements carry most of it.</p>
              <dc-import name="ChecklistItems" items="{{ checks.redflags }}" hint-size="100%,560px"></dc-import>
            </section>
          </sc-if>

          <sc-if value="{{ is.strategy }}" hint-placeholder-val="{{ false }}">
            
            <section id="sub-priorities" style="display:grid;gap:14px;padding-top:12px">
              <div style="display:flex;align-items:center;gap:12px;flex-wrap:wrap"><h4 style="margin:0;font-size:18px">Strategic priorities</h4></div>
              <dc-import name="ChecklistItems" items="{{ checks.priorities }}" hint-size="100%,420px"></dc-import>
            </section>

            <section id="sub-capex" style="display:grid;gap:14px;padding-top:36px">
              <div style="display:flex;align-items:center;gap:12px;flex-wrap:wrap"><h4 style="margin:0;font-size:18px">Capital expenditures</h4></div>
              <p style="margin:0;font-size:13px;color:var(--color-neutral-400)">Where the company puts its cash. Capex above depreciation usually means it is spending to grow, not only to maintain.</p>
              <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:8px">
                <sc-for list="{{ capexTiles }}" as="k" hint-placeholder-count="4">
                  <div style="display:grid;gap:3px;padding:12px 14px;border-radius:var(--radius-md);background:var(--color-surface)">

                    <span style="font-size:14px;font-weight:500;text-align:right">{{ g.a10 }}</span>

              <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:8px">

              <div style="display:grid;overflow-x:auto">
                <div style="display:grid;grid-template-columns:minmax(140px,1.2fr) repeat(3,minmax(80px,0.7fr)) minmax(150px,1.2fr);gap:14px;padding:6px 0;min-width:620px;background:linear-gradient(to right, transparent, var(--color-divider) 48px, var(--color-divider) calc(100% - 48px), transparent) no-repeat bottom / 100% 1px">

                  <span style="font-size:11px;letter-spacing:0.08em;text-transform:uppercase;color:var(--color-neutral-500);text-align:right">Forward</span>
                  <span style="font-size:11px;letter-spacing:0.08em;text-transform:uppercase;color:var(--color-neutral-500);text-align:right">Peer median</span>

            <section id="sub-dcf" style="display:grid;gap:16px;padding-top:36px">
              <div style="display:flex;align-items:center;gap:12px;flex-wrap:wrap"><h4 style="margin:0;font-size:18px">Discounted cash flow</h4></div>
              <p style="margin:0;font-size:13px;color:var(--color-neutral-400)">Ten years of free cash flow in two growth stages, then a terminal value, discounted back at your required return.</p>
              <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:28px;align-items:start">

                </div>

                  <span class="card-kicker">Intrinsic value per share</span>

              </div>
              <div style="display:grid;gap:6px">
                <div style="display:flex;gap:16px;font-size:12px;color:var(--color-neutral-400)">
                  <span style="display:flex;align-items:center;gap:6px"><span style="width:8px;height:8px;border-radius:2px;background:var(--color-accent-800)"></span>Projected FCF</span>
                  <span style="display:flex;align-items:center;gap:6px"><span style="width:8px;height:8px;border-radius:2px;background:var(--color-accent)"></span>Present value</span>
                </div>
                <div style="display:flex;align-items:flex-end;gap:6px;height:130px">
                  <sc-for list="{{ dcfBars }}" as="b" hint-placeholder-count="10">
                    <span title="{{ b.tip }}" style="flex:1;height:{{ b.h }};background:var(--color-accent-800);border-radius:3px 3px 0 0;display:flex;align-items:flex-end">
                      <span style="display:block;width:100%;height:{{ b.pv }};background:var(--color-accent);border-radius:3px 3px 0 0"></span>

                    <sc-for list="{{ r.cells }}" as="cl" hint-placeholder-count="3"><span style="font-size:13.5px;text-align:center;padding:8px 0;border-radius:var(--radius-sm);background:{{ cl.bg }};color:{{ cl.color }}">{{ cl.t }}</span></sc-for>

          <sc-if value="{{ chartMounted }}" hint-placeholder-val="{{ false }}">
            <section id="sub-chart" style="display:grid;gap:10px;padding-top:12px;box-sizing:border-box;grid-template-rows:auto auto minmax(0,1fr);{{ chartPlace }}">
              <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap">
                <label style="display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--color-neutral-400)">Chart symbol

                  </div>
                  <sc-if value="{{ tvIntOpen }}" hint-placeholder-val="{{ false }}">
                    <div onClick="{{ tvIntClose }}" style="position:fixed;inset:0;z-index:20"></div>
                    <div role="listbox" style="position:absolute;top:calc(100% + 6px);left:0;z-index:21;display:grid;min-width:210px;max-height:calc(100vh - 260px);overflow-y:auto;padding:4px 0;background:var(--color-surface);border:1px solid var(--color-divider);border-radius:var(--radius-md);box-shadow:0 12px 32px rgba(0,0,0,0.45)">
                      <sc-for list="{{ tvIntGroups }}" as="g" hint-placeholder-count="3">

                            </sc-for>
                          </sc-if>

                      </sc-for>

                </div>
                <div style="position:relative">
                  <button onClick="{{ tvStyleToggle }}" aria-haspopup="listbox" style="display:flex;align-items:center;gap:8px;min-height:30px;padding:4px 10px;background:{{ tvStyleBtnBg }};border:1px solid {{ tvStyleBtnBorder }};border-radius:var(--radius-md);color:var(--color-neutral-400);font:inherit;font-size:12.5px;cursor:pointer" style-hover="border-color:var(--color-neutral-600)"><i class="ph ph-chart-bar" style="font-size:14px"></i><span style="color:var(--color-text);font-weight:500">{{ tvStyleLabel }}</span><i class="{{ tvStyleCaret }}" style="font-size:11px"></i></button>

                      </sc-for>
                    </div>
                  </sc-if>
                </div>
                <div style="position:relative">
                  <button onClick="{{ maToggle }}" aria-haspopup="dialog" style="display:flex;align-items:center;gap:8px;min-height:30px;padding:4px 10px;background:{{ maBtnBg }};border:1px solid {{ maBtnBorder }};border-radius:var(--radius-md);color:var(--color-neutral-400);font:inherit;font-size:12.5px;cursor:pointer" style-hover="border-color:var(--color-neutral-600)"><i class="ph ph-chart-line" style="font-size:14px"></i>MA ribbon <span style="color:var(--color-text);font-weight:500">{{ maSummary }}</span><i class="{{ maCaret }}" style="font-size:11px"></i></button>

  <sc-if value="{{ macMounted }}" hint-placeholder-val="{{ false }}">

                <label style="display:grid;gap:6px;font-size:12.5px;color:var(--color-neutral-400)">Email<input class="input" value="{{ secEmail }}" onChange="{{ onSecEmail }}" autoComplete="off" style="min-height:32px;font-size:13px"></label>

            </div>
            <div style="display:grid;gap:10px">
              <div style="display:flex;align-items:center;gap:10px">
