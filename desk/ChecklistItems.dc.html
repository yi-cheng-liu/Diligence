<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc><template>
<helmet>
  <link rel="stylesheet" href="_ds/nocturne-e1ee5842-13e2-4a15-8f5e-73e39018410f/styles.css">
  <script src="_ds/nocturne-e1ee5842-13e2-4a15-8f5e-73e39018410f/_ds_bundle.js"></script>
</helmet>
<div style="display:grid;gap:8px">
  <sc-for list="{{ items }}" as="it" hint-placeholder-count="3">
    <div style="display:grid;gap:10px;padding:14px 16px;border-radius:var(--radius-md);background:var(--color-surface);box-shadow:{{ it.edge }}">
      <div style="display:flex;gap:16px;align-items:flex-start;flex-wrap:wrap">
        <div style="flex:1 1 300px;display:grid;gap:3px">
          <div style="font-size:14.5px;font-weight:500">{{ it.title }}</div>
          <div style="font-size:13px;line-height:1.5;color:var(--color-neutral-400);text-wrap:pretty">{{ it.prompt }}</div>
        </div>
        <div class="seg" style="flex:none">
          <label class="seg-opt"><input type="radio" name="{{ it.id }}" checked="{{ it.isOpen }}" onChange="{{ it.setOpen }}">Open</label>
          <label class="seg-opt"><input type="radio" name="{{ it.id }}" checked="{{ it.isOk }}" onChange="{{ it.setOk }}">Looks fine</label>
          <label class="seg-opt"><input type="radio" name="{{ it.id }}" checked="{{ it.isFlag }}" onChange="{{ it.setFlag }}">Concern</label>
        </div>
      </div>
      <textarea class="input" placeholder="Notes and evidence" value="{{ it.note }}" onChange="{{ it.onNote }}" style="min-height:52px;font-size:13px"></textarea>
      <sc-if value="{{ it.hasLinks }}" hint-placeholder-val="{{ false }}">
        <div style="display:flex;flex-wrap:wrap;gap:6px;align-items:center">
          <span style="font-size:11px;letter-spacing:0.08em;text-transform:uppercase;color:var(--color-neutral-500)">Look in</span>
          <sc-for list="{{ it.links }}" as="l" hint-placeholder-count="2">
            <a href="{{ l.url }}" target="_blank" rel="noopener" class="tag tag-neutral" style="text-decoration:none" style-hover="background:var(--color-neutral-700)">{{ l.label }} ↗</a>
          </sc-for>
        </div>
      </sc-if>
    </div>
  </sc-for>
</div>
</template></x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:760,&quot;height&quot;:420},&quot;items&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;Array&lt;{id:string,title:string,prompt:string,note:string,isOpen:boolean,isOk:boolean,isFlag:boolean,setOpen:Function,setOk:Function,setFlag:Function,onNote:Function,hasLinks:boolean,links:Array&lt;{label:string,url:string}&gt;,edge:string}&gt;&quot;}}"></script>
</body>
</html>
