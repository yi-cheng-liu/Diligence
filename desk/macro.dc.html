<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Macro</title>
<link rel="icon" type="image/png" sizes="64x64" href="./favicon.png?v=4">
<script src="./support.js"></script>
</head>
<body>
<x-dc><template>
<helmet>
  <link rel="stylesheet" href="_ds/nocturne-e1ee5842-13e2-4a15-8f5e-73e39018410f/styles.css">
  <link rel="stylesheet" href="vendor/phosphor-2.1.1/regular/style.css"><link rel="stylesheet" href="vendor/phosphor-2.1.1/fill/style.css">
  <style>
    :root{color-scheme:dark;--ink:var(--color-text);--ink2:var(--color-neutral-300);--ink3:var(--color-neutral-500);--line:var(--color-neutral-800);
      --hair:color-mix(in srgb,var(--ink) 9%,transparent);--acc:var(--color-accent-300);--acc-soft:color-mix(in srgb,var(--color-accent) 14%,transparent);
      --up:oklch(0.78 0.14 155);--down:oklch(0.72 0.16 25);--warn:oklch(0.83 0.15 85);--panel:var(--color-surface)}
    html,body{margin:0;background:var(--color-bg);color:var(--ink)}
    *{box-sizing:border-box}
    ::-webkit-scrollbar{width:10px;height:10px}::-webkit-scrollbar-thumb{background:var(--line);border-radius:8px;border:2px solid var(--color-bg)}
    button,input,select,textarea{font:inherit;color:inherit}
    .app{min-height:100vh;display:flex;flex-direction:column;font-size:14px;font-variant-numeric:tabular-nums}
    .top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:14px;padding:10px 24px;background:var(--color-bg);border-bottom:1px solid var(--hair)}
    .brand{display:flex;align-items:center;gap:8px;font-size:17px;font-weight:500}.brand i{color:var(--color-accent)}
    .tabs{display:flex;gap:2px;margin-left:10px}
    .tab{border:0;background:transparent;padding:7px 12px;border-radius:8px;color:var(--ink3);cursor:pointer;font-size:13.5px}
    .tab:hover{color:var(--ink)}.tab[aria-pressed="true"]{color:var(--ink);background:var(--acc-soft)}
    .grow{flex:1}
    .src{display:flex;align-items:center;gap:7px;font-size:12.5px;color:var(--ink3)}.dot{width:8px;height:8px;border-radius:50%;display:inline-block}
    .b{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:32px;padding:4px 12px;border-radius:8px;border:1px solid var(--line);background:transparent;font-size:13px;color:var(--ink2);cursor:pointer;white-space:nowrap}
    .b:hover{background:color-mix(in srgb,var(--ink) 7%,transparent);color:var(--ink)}.b.pri{border-color:var(--color-accent);color:var(--acc)}.b.pri:hover{background:var(--acc-soft)}
    .b.sm{min-height:26px;padding:2px 9px;font-size:12px}.b:disabled{opacity:.4;cursor:not-allowed}
    .f{min-height:34px;padding:6px 10px;background:var(--color-bg);border:1px solid var(--line);border-radius:8px;font-size:13px;width:100%}
    .f:focus{outline:none;border-color:var(--color-accent)}
    .card{background:color-mix(in srgb,var(--panel) 55%,transparent);border:1px solid var(--line);border-radius:12px}
    .cap{margin:0 0 12px;font-size:12px;font-weight:500;letter-spacing:.08em;text-transform:uppercase;color:var(--ink3);display:flex;gap:10px;align-items:baseline}
    .cap small{font-size:12px;letter-spacing:0;text-transform:none;color:var(--ink3)}
    .note{font-size:12.5px;color:var(--ink3);line-height:1.55;margin:0}
    .up{color:var(--up)}.down{color:var(--down)}.dim{color:var(--ink3)}
    /* dashboard */
    .dash{max-width:1500px;width:100%;margin:0 auto;padding:26px 28px 80px}
    .hero h1{margin:0;font-size:28px;font-weight:500;letter-spacing:-.02em}.sub{margin:6px 0 0;color:var(--ink3);max-width:760px;line-height:1.55}
    .row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.hero .row{margin-top:16px}
    .search{flex:1;min-width:320px;position:relative;display:flex;align-items:center}.search i{position:absolute;left:12px;color:var(--ink3)}
    .search input{width:100%;padding:10px 12px 10px 36px;border:1px solid var(--line);border-radius:10px;background:var(--color-bg);font-size:14px}
    .search input:focus{outline:none;border-color:var(--color-accent)}
    section.blk{margin-top:34px}
    .cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
    .scard{padding:12px 14px 10px;cursor:pointer;transition:border-color .15s}.scard:hover{border-color:var(--color-neutral-600)}
    .scard .top2{display:flex;justify-content:space-between;align-items:center;font-size:11px;color:var(--ink3);font-family:ui-monospace,monospace}
    .badge{font-size:11px;font-weight:600;padding:1px 7px;border-radius:5px;font-family:inherit}
    .scard .nm{font-size:14px;font-weight:500;margin-top:4px;line-height:1.3;min-height:36px}
    .scard .sp{height:44px;margin:6px 0}.scard .val{font-size:18px;font-weight:500}.scard .unit{font-size:11px;color:var(--ink3);margin-left:6px}
    .topics{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 14px}
    .topics button{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--hair);background:color-mix(in srgb,var(--ink) 5%,transparent);color:var(--ink2);border-radius:6px;padding:5px 11px;font-size:13px;cursor:pointer}
    .topics button:hover{color:var(--ink);border-color:var(--color-neutral-600)}
    .topics button span{font-size:11px;color:var(--ink3);font-variant-numeric:tabular-nums}
    .topics button[aria-selected="true"]{background:var(--acc-soft);border-color:var(--color-accent);color:var(--ink)}.topics button[aria-selected="true"] span{color:var(--acc)}
    .pcard{overflow:hidden;cursor:pointer}.pcard:hover{border-color:var(--color-neutral-600)}.pcard .mini{height:86px;border-bottom:1px solid var(--hair);padding:6px}
    .pcard .tx{padding:10px 12px 12px}.pcard .tx b{font-weight:500;font-size:14px}.pcard .tx p{margin:4px 0 0;font-size:12px;color:var(--ink3);line-height:1.45}
    .browse{display:grid;grid-template-columns:240px minmax(0,1fr);gap:16px;align-items:start}
    .tree{padding:6px;position:sticky;top:64px}
    .tnode{display:flex;justify-content:space-between;align-items:center;width:100%;border:0;background:transparent;padding:8px 10px;border-radius:8px;cursor:pointer;color:var(--ink2);text-align:left;font-size:13px}
    .tnode:hover{background:color-mix(in srgb,var(--ink) 6%,transparent)}.tnode[aria-pressed="true"]{background:var(--acc-soft);color:var(--ink)}
    .tnode small{color:var(--ink3);font-size:11px}.tnode.sub2{padding-left:24px;font-size:12.5px}
    .frow{display:grid;grid-template-columns:150px minmax(0,1fr) auto;gap:12px;align-items:baseline;padding:9px 12px;border-bottom:1px solid var(--hair);cursor:pointer}
    .frow:hover{background:color-mix(in srgb,var(--ink) 4%,transparent)}.frow code{font-size:12px;color:var(--ink3)}.frow span.m{font-size:12px;color:var(--ink3)}
    /* editor */
    .ed{padding:14px 20px 60px;width:100%}
    .edbar{display:flex;gap:10px;align-items:center;margin-bottom:12px}
    .title{flex:1;font-size:19px;font-weight:500;border:0;background:transparent;padding:5px 4px;border-bottom:1px solid transparent}.title:focus{outline:none;border-bottom-color:var(--line)}
    .edgrid{display:grid;grid-template-columns:250px minmax(0,1fr) 330px;gap:14px;align-items:start}
    .side{position:sticky;top:62px;max-height:calc(100vh - 80px);overflow-y:auto;padding:10px 8px}
    .shead{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink3);padding:12px 6px 5px;display:flex;justify-content:space-between;align-items:center;cursor:pointer}
    .sitem{display:flex;align-items:center;gap:8px;padding:6px 6px;border-radius:7px;cursor:pointer}
    .sitem:hover{background:color-mix(in srgb,var(--ink) 6%,transparent)}.sitem .t{flex:1;min-width:0}.sitem .t>b{display:block;font-weight:500;font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .sitem .t>code{font-size:10.5px;color:var(--ink3)}.sitem .t>span{display:block;font-size:11px;color:var(--ink3);line-height:1.35}
    .pm{width:24px;height:24px;border-radius:50%;border:1px solid var(--line);background:transparent;display:grid;place-items:center;cursor:pointer;font-size:14px;color:var(--acc);flex:none}
    .pm.on{background:var(--color-accent);border-color:var(--color-accent);color:#fff}
    .controls{display:flex;gap:14px;align-items:center;flex-wrap:wrap;padding:10px 14px;border-bottom:1px solid var(--hair)}
    .lbl{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink3)}
    .seg{display:flex;background:color-mix(in srgb,var(--ink) 6%,transparent);border-radius:8px;padding:3px;gap:2px}
    .seg button{border:0;background:transparent;border-radius:6px;padding:5px 10px;font-size:12.5px;color:var(--ink3);cursor:pointer;position:relative}
    .seg button:hover{color:var(--ink)}.seg button[aria-pressed="true"]{background:var(--color-bg);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.3)}
    .seg button:disabled{opacity:.32;cursor:not-allowed}.seg button.best::after{content:'';position:absolute;top:3px;right:3px;width:5px;height:5px;border-radius:50%;background:var(--up)}
    .typenote{padding:8px 14px;font-size:12.5px;color:var(--warn);background:color-mix(in srgb,var(--warn) 7%,transparent);border-bottom:1px solid var(--hair)}
    .warnbar{display:flex;gap:10px;align-items:center;padding:9px 14px;font-size:12.5px;color:var(--warn);border-bottom:1px solid var(--hair);background:color-mix(in srgb,var(--warn) 6%,transparent)}
    .chart{padding:10px 8px 6px;min-height:440px;position:relative}
    .picker{position:absolute;top:44px;z-index:30;padding:12px;width:240px;background:var(--panel);border:1px solid var(--line);border-radius:10px;box-shadow:0 10px 30px rgba(0,0,0,.4)}
    .lrow{display:grid;grid-template-columns:22px minmax(150px,1.4fr) 190px 70px 150px 26px;gap:10px;align-items:center;padding:9px 14px;border-top:1px solid var(--hair)}
    .sw{width:16px;height:16px;border-radius:4px;border:0;cursor:pointer}
    .lname{min-width:0;cursor:pointer}.lname>b{font-family:ui-monospace,monospace;font-size:12px;font-weight:500}.lname>span{display:block;font-size:12px;color:var(--ink3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .ldet{padding:4px 14px 14px 46px;font-size:12.5px;line-height:1.6;color:var(--ink2);border-top:1px dashed var(--hair)}
    .ldet dl{display:grid;grid-template-columns:auto 1fr;gap:2px 12px;margin:6px 0}.ldet dt{color:var(--ink3)}.ldet dd{margin:0}
    .about{position:sticky;top:62px;display:grid;gap:12px;max-height:calc(100vh - 80px);overflow-y:auto}
    .about .card{padding:12px 14px}.about h4{margin:0 0 8px;font-size:12.5px;font-weight:600;display:flex;justify-content:space-between;align-items:center}
    .about p{margin:0 0 8px;font-size:12.5px;line-height:1.6;color:var(--ink2)}
    .lineinfo{padding:8px 0;border-top:1px solid var(--hair);font-size:12.5px;line-height:1.55;color:var(--ink2)}.lineinfo:first-of-type{border-top:0}
    .lineinfo b{font-weight:500;color:var(--ink)}.lineinfo i{font-style:normal;color:var(--ink3)}
    .caution{display:flex;gap:7px;font-size:12px;color:var(--ink2);line-height:1.5;margin-top:5px}.caution span:first-child{color:var(--warn)}
    .rel1{display:flex;gap:8px;align-items:flex-start;padding:7px 0;border-top:1px solid var(--hair);font-size:12.5px;line-height:1.45}.rel1:first-of-type{border-top:0}
    .rel1 .t{flex:1}.rel1 .t>span{display:block;font-size:11.5px;color:var(--ink3)}
    .md{font-size:12.5px;line-height:1.6;color:var(--ink2)}.md h3{font-size:12.5px;margin:12px 0 4px;color:var(--ink)}.md p{margin:0 0 8px}.md ul{padding-left:1.2em;margin:0 0 8px}
    textarea.f{min-height:110px;resize:vertical;line-height:1.5}
    /* relations */
    .rel{padding:20px 24px 60px}.rel h1{margin:0;font-size:24px;font-weight:500}
    .relbody{display:grid;grid-template-columns:minmax(0,1fr) 340px;grid-template-areas:"map side" "tree side";gap:14px;margin-top:16px;align-items:start}
    .relmap{grid-area:map;overflow-x:auto;padding:8px}.reltree{grid-area:tree;min-width:0}.reltree>section{padding:14px 16px}
    .relside{grid-area:side;padding:14px 16px;position:sticky;top:62px;max-height:calc(100vh - 80px);overflow-y:auto}
    .relside .cols{display:grid;gap:4px}
    @media (max-width:1749px){.relbody{grid-template-columns:minmax(0,1fr);grid-template-areas:"map" "side" "tree"}.relside{position:static;max-height:none}.relside .cols{grid-template-columns:1.2fr 1fr 1fr;gap:24px}}
    .relside h3{margin:0 0 4px;font-size:16px;font-weight:500}
    .chain{margin:14px 0 0;padding:0;list-style:none;counter-reset:c;columns:3 300px;column-gap:28px}
    .chain li{position:relative;padding:7px 0 7px 26px;border-top:1px solid var(--hair);font-size:12.5px;line-height:1.45;break-inside:avoid}
    .chain li::before{counter-increment:c;content:counter(c);position:absolute;left:0;top:8px;width:18px;height:18px;border-radius:50%;background:var(--acc-soft);font-size:10.5px;display:grid;place-items:center;color:var(--ink2)}
    .chain li>span{display:block;color:var(--ink3);font-size:11.5px}
    .legend{display:flex;gap:16px;flex-wrap:wrap;font-size:12px;color:var(--ink3);margin-top:8px}
    /* modals */
    .scrim{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.5);display:flex;align-items:flex-start;justify-content:center;padding:60px 20px}
    .modal{width:600px;max-width:100%;max-height:80vh;display:flex;flex-direction:column;background:var(--panel);border:1px solid var(--line);border-radius:14px;box-shadow:0 24px 60px rgba(0,0,0,.5);overflow:hidden}
    .modal .mh{padding:14px 16px;border-bottom:1px solid var(--hair);display:grid;gap:10px}.modal .mh h3{margin:0;font-size:16px;font-weight:500;display:flex;justify-content:space-between}
    .modal .mb{overflow-y:auto;padding:8px 10px 14px}
    .toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);z-index:60;background:var(--panel);border:1px solid var(--line);padding:10px 18px;border-radius:9px;font-size:13px;box-shadow:0 8px 28px rgba(0,0,0,.4)}
    .empty{border:1px dashed var(--line);border-radius:12px;padding:22px;text-align:center;color:var(--ink3);font-size:13px}
  </style>
</helmet>

<div class="app">
  <header class="top">
    <span class="brand"><i class="ph ph-chart-line-up"></i>Macro</span>
    <nav class="tabs">
      <sc-for list="{{ tabs }}" as="tb" hint-placeholder-count="3">
        <button class="tab" aria-pressed="{{ tb.on }}" onClick="{{ tb.go }}">{{ tb.label }}</button>
      </sc-for>
    </nav>
    <span class="grow"></span>
    <span class="src" title="{{ srcTip }}"><span class="dot" style="background:{{ srcDot }}"></span>{{ srcLabel }}</span>
    <button class="b sm" onClick="{{ openKey }}"><i class="ph ph-key"></i>{{ keyBtnLabel }}</button>
  </header>

  <!-- ===== DASHBOARD ===== -->
  <sc-if value="{{ isDashboard }}" hint-placeholder-val="{{ true }}">
  <main class="dash">
    <div class="hero">
      <h1>The U.S. economy</h1>
      <p class="sub">Search the catalog, or all of FRED once a key is set. Open a featured relationship, or start from the map of how the economy connects. Click any indicator to chart it, then overlay and transform lines and save the result.</p>
      <div class="row">
        <div class="search"><i class="ph ph-magnifying-glass"></i><input value="{{ heroQ }}" onInput="{{ onHeroQ }}" placeholder="{{ searchPlaceholder }}"></div>
        <button class="b pri" onClick="{{ openBlank }}"><i class="ph ph-plus"></i>New chart</button>
        <button class="b" onClick="{{ goRelations }}"><i class="ph ph-graph"></i>How it connects</button>
      </div>
    </div>

    <sc-if value="{{ isSearching }}" hint-placeholder-val="{{ false }}">
      <section class="blk">
        <h2 class="cap">In the catalog <small>{{ searchCountLabel }}</small></h2>
        <sc-if value="{{ searchEmpty }}" hint-placeholder-val="{{ false }}"><p class="note">Nothing in the catalog matches.</p></sc-if>
        <div class="cards">
          <sc-for list="{{ searchItems }}" as="it" hint-placeholder-count="3">
            <div class="card scard" onClick="{{ it.onOpen }}">
              <div class="top2"><span>{{ it.code }}</span><span class="badge" style="background:{{ it.badgeBg }};color:{{ it.badgeFg }}">{{ it.change }}</span></div>
              <div class="nm">{{ it.short }}</div>
              <div class="sp">{{ it.spark }}</div>
              <div><span class="val">{{ it.latest }}</span><span class="unit">{{ it.units }}</span></div>
            </div>
          </sc-for>
        </div>
      </section>
      <section class="blk">
        <h2 class="cap">All of FRED <small>{{ fredCountLabel }}</small></h2>
        <p class="note">{{ fredNote }}</p>
        <div class="card" style="margin-top:10px;overflow:hidden">
          <sc-for list="{{ fredItems }}" as="f" hint-placeholder-count="0">
            <div class="frow" onClick="{{ f.onOpen }}" title="{{ f.notes }}"><code>{{ f.id }}</code><span>{{ f.title }}</span><span class="m">{{ f.meta }}</span></div>
          </sc-for>
        </div>
      </section>
    </sc-if>

    <sc-if value="{{ notSearching }}" hint-placeholder-val="{{ true }}">
      <section class="blk">
        <h2 class="cap">Your saved charts <small>{{ savedCountLabel }}</small></h2>
        <sc-if value="{{ noSaved }}" hint-placeholder-val="{{ true }}"><div class="empty">No saved charts yet. Build one and press Save to keep it here.</div></sc-if>
        <div class="cards">
          <sc-for list="{{ savedList }}" as="g" hint-placeholder-count="0">
            <div class="card pcard" onClick="{{ g.onOpen }}">
              <div class="mini">{{ g.mini }}</div>
              <div class="tx"><div class="row" style="justify-content:space-between"><b>{{ g.title }}</b><button class="b sm" onClick="{{ g.onDelete }}" title="Delete">✕</button></div><p>{{ g.sub }}</p></div>
            </div>
          </sc-for>
        </div>
      </section>

      <section class="blk">
        <h2 class="cap">Featured charts <small>by topic, each with a note on how to read it</small></h2>
        <div class="topics" role="tablist" aria-label="Topics">
          <sc-for list="{{ presetTopics }}" as="t" hint-placeholder-count="8"><button role="tab" aria-selected="{{ t.on }}" onClick="{{ t.pick }}">{{ t.label }}<span>{{ t.count }}</span></button></sc-for>
        </div>
        <div class="cards">
          <sc-for list="{{ presetCards }}" as="p" hint-placeholder-count="6">
            <div class="card pcard" onClick="{{ p.onOpen }}">
              <div class="mini">{{ p.mini }}</div>
              <div class="tx"><b>{{ p.name }}</b><p>{{ p.desc }}</p></div>
            </div>
          </sc-for>
        </div>
      </section>

      <section class="blk">
        <h2 class="cap">Browse the catalog <small>{{ catalogStatLabel }}</small></h2>
        <div class="browse">
          <div class="card tree">
            <sc-for list="{{ catTree }}" as="c" hint-placeholder-count="7">
              <button class="tnode" aria-pressed="{{ c.on }}" onClick="{{ c.onSelect }}"><span>{{ c.title }}</span><small>{{ c.count }}</small></button>
              <sc-for list="{{ c.groups }}" as="gg" hint-placeholder-count="0">
                <button class="tnode sub2" aria-pressed="{{ gg.on }}" onClick="{{ gg.onSelect }}"><span>{{ gg.title }}</span><small>{{ gg.count }}</small></button>
              </sc-for>
            </sc-for>
          </div>
          <div>
            <div class="row" style="justify-content:space-between;margin-bottom:12px"><div><b style="font-weight:500;font-size:16px">{{ resTitle }}</b><p class="note">{{ resBlurb }}</p></div><span class="note">{{ resCountLabel }}</span></div>
            <div class="cards">
              <sc-for list="{{ browseItems }}" as="it" hint-placeholder-count="6">
                <div class="card scard" onClick="{{ it.onOpen }}">
                  <div class="top2"><span>{{ it.code }}</span><span class="badge" style="background:{{ it.badgeBg }};color:{{ it.badgeFg }}">{{ it.change }}</span></div>
                  <div class="nm">{{ it.short }}</div>
                  <div class="sp">{{ it.spark }}</div>
                  <div><span class="val">{{ it.latest }}</span><span class="unit">{{ it.units }}</span></div>
                </div>
              </sc-for>
            </div>
            <sc-if value="{{ moreVisible }}" hint-placeholder-val="{{ false }}"><button class="b" style="width:100%;margin-top:12px" onClick="{{ onShowMore }}">{{ moreLabel }}</button></sc-if>
          </div>
        </div>
      </section>
    </sc-if>
  </main>
  </sc-if>

  <!-- ===== RELATIONS ===== -->
  <sc-if value="{{ isRelations }}" hint-placeholder-val="{{ false }}">
  <main class="rel">
    <h1>How the economy connects</h1>
    <p class="sub">Each arrow is a cause and effect economists rely on. <b class="up">+</b> means the next indicator moves the same way; <b class="down">−</b> means it moves the opposite way. Hover an indicator to light up only its arrows; click it to select it, then push it up or down to follow what happens next. The figures are the latest readings.</p>
    <div class="relbody">
      <div class="card relmap">{{ relMap }}
        <div class="legend" style="padding:4px 10px 6px"><span><b class="up">━</b> same direction (+)</span><span><b class="down">━</b> opposite direction (−)</span><span>╌ feedback (when shown)</span><span style="color:var(--warn)">┈ warning sign, not a cause</span><span>Hover an indicator to light up its arrows · hover an arrow for the mechanism</span></div></div>
      <div class="reltree">
        <sc-if value="{{ relHasChain }}" hint-placeholder-val="{{ false }}">
          <section class="card">
            <div class="row" style="justify-content:space-between"><div><div class="cap" style="margin:0">What follows</div><b style="font-weight:500;font-size:16px">{{ relChainTitle }}</b></div>

<script type="text/x-dc" data-dc-script data-props="{&quot;chartHeight&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:430,&quot;min&quot;:320,&quot;max&quot;:620,&quot;tsType&quot;:&quot;number&quot;}}">
// ---- The Macro page: U.S. economic series charted with Recharts, a map of how the indicators drive one another, and
// plain-words explanations. Data comes from the local server (/api/macro/...), which uses FRED with a key and keyless
// sources for the core series otherwise. Built from the FRED Studio catalog design.
const PAL = ['#8ab4f8', '#f28b82', '#81c995', '#fdd663', '#c58af9', '#78d9ec', '#fcad70', '#ff8bcb', '#a8dab5', '#d7aefb', '#e6c79c', '#9aa0ff', '#5fb3a1', '#f6a6c1', '#c9e07a', '#b0b4c8'];
const UPC = 'oklch(0.78 0.14 155)', DOWNC = 'oklch(0.72 0.16 25)';
const addM = (k, n) => { let [y, m] = k.split('-').map(Number); m += n; y += Math.floor((m - 1) / 12); m = (((m - 1) % 12) + 12) % 12 + 1; return y + '-' + String(m).padStart(2, '0'); };
const monthsBetween = (a, b) => { const out = []; if (!a || !b) return out; for (let k = a; k <= b && out.length < 2000; k = addM(k, 1)) out.push(k); return out; };
const nowMonth = () => new Date().toISOString().slice(0, 7);
const getJSON = url => fetch(url).then(r => r.json().then(d => { if (!r.ok) throw new Error(d.error || r.statusText); return d; }));
const postJSON = (url, body) => fetch(url, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) }).then(r => r.json().then(d => { if (!r.ok) throw new Error(d.error || r.statusText); return d; }));
const loadScript = src => new Promise((ok, fail) => { if (document.querySelector('script[data-src="' + src + '"]')) return ok(); const s = document.createElement('script'); s.src = src; s.dataset.src = src; s.onload = ok; s.onerror = () => fail(new Error('could not load ' + src)); document.head.appendChild(s); });
const lsGet = (k, d) => { try { const v = JSON.parse(localStorage.getItem(k)); return v == null ? d : v; } catch (e) { return d; } };
const lsSet = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} };

// ---- The catalog. why = why it matters, read = how to read it. add = parts of one total in the same units (can be stacked or shown as a pie).
const S = (id, short, name, units, freq, sec, x) => Object.assign({ id, short, name, units, freq, sec }, x || {});
const CORE = [
  S('GDPC1', 'Real GDP', 'Real Gross Domestic Product', 'Bil. of chained 2017 $', 'Quarterly', 'output', { why: 'The broadest measure of what the economy produces, after inflation.', read: 'Switch to change from a year ago: above about 2% is solid growth; falling output for two quarters is the rough sign of a recession.' }),
  S('GDP', 'Nominal GDP', 'Gross Domestic Product', 'Bil. of $', 'Quarterly', 'output', { why: 'Output in today\'s dollars, so it grows with both real activity and inflation.', read: 'The gap between its growth and real GDP\'s growth is roughly the inflation rate.' }),
  S('INDPRO', 'Industrial Production', 'Industrial Production: Total Index', 'Index 2017=100', 'Monthly', 'output', { why: 'Monthly output of factories, mines and utilities: an early read on the cycle.', read: 'Several months of decline often come before or with a recession.' }),
  S('GPDIC1', 'Real Private Investment', 'Real Gross Private Domestic Investment', 'Bil. of chained 2017 $', 'Quarterly', 'output', { why: 'Business spending on equipment, buildings and software plus home building: the most cyclical part of GDP.', read: 'Swings far more than GDP; higher interest rates bite here first.' }),
  S('PCEC96', 'Real Consumer Spending', 'Real Personal Consumption Expenditures', 'Bil. of chained 2017 $', 'Monthly', 'output', { why: 'What households spend after inflation: about two-thirds of GDP.', read: 'Steady growth of 2–3% a year is normal; a slowdown here drags the whole economy.' }),
  S('GCEC1', 'Real Government Spending', 'Real Government Consumption Expenditures and Gross Investment', 'Bil. of chained 2017 $', 'Quarterly', 'output', { why: 'What governments buy: services, equipment, roads. Transfers like Social Security are not included.', read: 'Tends to rise in recessions and wars; it adds to GDP directly.' }),
  S('PCE', 'Consumer Spending ($)', 'Personal Consumption Expenditures', 'Bil. of $', 'Monthly', 'output', { add: 'gdpparts', why: 'Household spending in today\'s dollars.', read: 'Compare with GDP to see the share of the economy that is consumption.' }),
  S('GPDI', 'Private Investment ($)', 'Gross Private Domestic Investment', 'Bil. of $', 'Quarterly', 'output', { add: 'gdpparts', why: 'Business and housing investment in today\'s dollars.', read: 'Falls hard in recessions.' }),
  S('GCE', 'Government Spending ($)', 'Government Consumption Expenditures and Gross Investment', 'Bil. of $', 'Quarterly', 'output', { add: 'gdpparts', why: 'Government purchases in today\'s dollars.', read: 'A steady share of GDP, near a sixth.' }),
  S('NETEXP', 'Net Exports', 'Net Exports of Goods and Services', 'Bil. of $', 'Quarterly', 'output', { why: 'Exports minus imports; negative means the U.S. buys more abroad than it sells.', read: 'A stronger dollar usually makes it more negative a few quarters later.' }),
  S('TCU', 'Capacity Utilization', 'Capacity Utilization: Total Industry', '% of capacity', 'Monthly', 'output', { why: 'How much of the country\'s industrial capacity is in use.', read: 'Above about 80% tends to push prices up; below 75% signals slack.' }),
  S('UNRATE', 'Unemployment Rate', 'Unemployment Rate', 'Percent', 'Monthly', 'labor', { why: 'Share of the labor force without a job and looking for one.', read: 'Around 4% is a tight job market. A rise of half a point from its low has signalled past recessions (the Sahm rule).' }),
